[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediconfirm"
version = "2.0.0"
description = "A notebook-based medication package verification assistant"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.1,<4",
  "anywidget>=0.9,<1",
  "ipywidgets>=8,<9",
  "requests>=2.31,<3",
  "Pillow>=10,<13",
  "gTTS>=2.5,<3",
  "openai-whisper>=20240930",
  "numpy>=1.24,<3",
  "imageio-ffmpeg>=0.5,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mediconfirm = ["*.mjs", "web/*.html", "web/*.css", "web/*.js", "resources/drug_labels/*.xml", "resources/drug_labels/*.json"]
